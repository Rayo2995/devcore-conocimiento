display_information:
  name: DevBrain
  description: Asistente de guardia de DevCore. Responde con la bóveda de ingeniería.
features:
  bot_user:
    display_name: DevBrain
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - channel_archive
      - group_archive
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
