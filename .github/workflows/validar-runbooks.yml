name: Validar conocimiento

on:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Runbook actualizado con el código
        run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          changed=$(git diff --name-only "$base" "$head")
          fail=0
          for svc in $(echo "$changed" | grep '^04-servicios/' | cut -d/ -f2 | sort -u); do
            code=$(echo "$changed" | grep "^04-servicios/$svc/src/" || true)
            runbook=$(echo "$changed" | grep "^04-servicios/$svc/runbook-$svc.md$" || true)
            if [ -n "$code" ] && [ -z "$runbook" ]; then
              echo "::error::El servicio $svc cambió su código sin actualizar 04-servicios/$svc/runbook-$svc.md"
              fail=1
            fi
          done
          exit $fail

      - name: Metadatos presentes
        run: |
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          fail=0
          for f in $(echo "$changed" | grep -E '^(00-moc|01-onboarding|02-arquitectura|03-incidentes|04-servicios)/.*\.md$' || true); do
            [ -f "$f" ] || continue
            if ! head -1 "$f" | grep -q '^---$' || ! grep -q '^tipo:' "$f" || ! grep -q '^titulo:' "$f"; then
              echo "::error file=$f::Falta el bloque de metadatos (tipo, titulo) al inicio del archivo"
              fail=1
            fi
          done
          exit $fail
