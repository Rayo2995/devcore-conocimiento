name: Validar runbooks

on:
  pull_request:

jobs:
  runbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar que el runbook se actualice con el código
        run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          changed=$(git diff --name-only "$base" "$head")
          fail=0
          for svc in $(echo "$changed" | grep '^services/' | cut -d/ -f2 | sort -u); do
            code=$(echo "$changed" | grep "^services/$svc/src/" || true)
            runbook=$(echo "$changed" | grep "^services/$svc/runbook.md$" || true)
            if [ -n "$code" ] && [ -z "$runbook" ]; then
              echo "::error::El servicio $svc cambió su código sin actualizar services/$svc/runbook.md"
              fail=1
            fi
          done
          exit $fail
